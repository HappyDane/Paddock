# Temporary experiment: measure z-order behaviour on real Windows desktops.
name: zorder-probe
on:
  push:
    paths: ['tools/zorder-probe/**', '.github/workflows/zorder-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build probe
        run: dotnet build tools/zorder-probe -c Release -o probe-bin
      - name: Run probe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath probe-bin/ZOrderProbe.exe -ArgumentList "$PWD/probe-out" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); "probe timed out" }
          Get-Content probe-out/probe.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe-out
